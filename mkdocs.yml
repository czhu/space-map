site_name: Space-map
site_description: 3D single-cell atlas reconstruction from serial sections
site_url: https://czhu.github.io/space-map
repo_url: https://github.com/czhu/space-map
repo_name: czhu/space-map

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.annotate

plugins:
  - search

exclude_docs: |
  code.py
  overview/*

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Method and Scope: method.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Inputs and Outputs: data/data-management.md
    - Examples: examples/examples.md
  - Implementation:
    - Workflow: workflow/key-workflows.md
    - Feature Matching: feature/feature-matching.md
    - LDDMM: registration/registration-system-(lddmm).md
    - Histology: alignment/image-alignment.md
    - Grid Transforms: grid/grid-transformations.md
    - Architecture: architecture/architecture-and-core-components.md
  - Reconstruction and Analysis:
    - 3D Visualization: reconstruction/3d-reconstruction.md
    - Evaluation: analysis/spatial-transcriptomics-analysis.md
  - Python API: api/api.md
  - Usage Guide: examples/usage.md
  - Contributing: contributing.md
  - Documentation Maintenance: BUILDING.md
